<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#12151a"/>
  <!-- isometric wireframe cube approximating the copper mark -->
  <g stroke="#c9854a" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- top face -->
    <path d="M16 9.2 L23.2 13.2 L16 17.2 L8.8 13.2 Z"/>
    <!-- verticals -->
    <path d="M8.8 13.2 V20.2 L16 24.2 V17.2"/>
