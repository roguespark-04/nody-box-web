<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#12151a"/>
  <!-- Copper circuit-trace N (approx. brand mark) -->
  <g fill="none" stroke="#c9854a" stroke-linecap="round" stroke-linejoin="round">
    <!-- left stem (outlined channel) -->
    <path stroke-width="2.1" d="M8.2 6.4 V25.6"/>
    <path stroke-width="1.35" d="M11.4 6.4 V25.6"/>
    <!-- diagonal circuit bar -->
    <path stroke-width="2.35" d="M11.2 8.1 L20.6 23.9"/>
    <!-- right stem -->
    <path stroke-width="2.1" d="M23.8 6.4 V25.6"/>
    <!-- trace nodes -->
    <circle cx="10.2" cy="9.6" r="1.45" fill="#c9854a" stroke="none"/>
    <circle cx="21.6" cy="22.4" r="1.45" fill="#c9854a" stroke="none"/>
    <!-- short spur traces -->
    <path stroke-width="1.2" d="M10.2 9.6 L12.4 9.0"/>
    <path stroke-width="1.2" d="M21.6 22.4 L19.4 23.0"/>
  </g>
</svg>
